name: 공고 자동 갱신

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 KST 09:00 (UTC 00:00)
  workflow_dispatch:       # GitHub 웹에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 lxml

      - name: 공고 크롤링
        run: python crawler/update.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notices.json index.html
          git diff --staged --quiet || git commit -m "data: $(date '+%Y-%m-%d') 공고 자동 갱신"
          git push
