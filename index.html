<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gov. Insight</title>
<style>
  :root{--ink:#1a1a1a;--muted:#aaa;--border:#e8e8e8;--bg:#f5f5f5;--surface:#fff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
  .wrap{max-width:1600px;margin:0 auto;padding:18px 24px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .logo{font-size:17px;font-weight:500;color:var(--ink);letter-spacing:-.2px}
  .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px}
  .tab{padding:6px 16px;border:0.5px solid var(--border);background:var(--surface);border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:.1s}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .search-input{width:200px;padding:6px 10px;border:0.5px solid var(--border);border-radius:6px;font-size:12px;outline:none;background:var(--surface)}
  .search-input:focus{border-color:#aaa}
  .count{font-size:12px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--ink);font-weight:600}
  .filter-row{display:flex;align-items:center;gap:5px;margin-bottom:10px}
  .sz-pill,.news-pill{padding:5px 13px;border:0.5px solid var(--border);background:var(--surface);border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:.1s}
  .sz-pill.on,.news-pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .filter-sep{width:0.5px;height:18px;background:var(--border);margin:0 4px;flex-shrink:0}
  .domain-row{display:flex;align-items:center;gap:5px;margin-bottom:10px;flex-wrap:wrap}
  .domain-label{font-size:11px;color:var(--muted);white-space:nowrap;margin-right:2px;flex-shrink:0}
  .domain-pill{padding:5px 12px;border:0.5px solid var(--border);background:var(--surface);border-radius:5px;font-size:11.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:.1s}
  .domain-pill.on{background:#2d5a8e;border-color:#2d5a8e;color:#fff}
  .active-bar{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .active-bar.show{display:flex}
  .active-lab{font-size:11px;color:var(--muted)}
  .active-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--ink);color:#fff;border-radius:4px;font-size:11px;cursor:pointer}
  .active-chip .x{opacity:.65;font-weight:700}
  .clear-btn{font-size:11px;color:var(--muted);background:none;border:0.5px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer;margin-left:auto}
  .clear-btn:hover{border-color:#aaa;color:var(--ink)}
  .tag-panel{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:4px 12px;margin-bottom:10px}
  .tag-group{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:0.5px dashed var(--border)}
  .tag-group:last-child{border-bottom:none}
  .tag-group-label{flex:0 0 68px;font-size:11px;color:var(--muted);padding-top:4px;white-space:nowrap}
  .tag-group-chips{flex:1;display:flex;flex-wrap:wrap;gap:3px}
  .tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;cursor:pointer;border:0.5px solid #e8e8e8;background:#fafafa;color:#888;margin:2px 2px 2px 0;transition:.1s}
  .tag:hover{border-color:#bbb;color:#555}
  .tag.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tag-cnt{opacity:.45;font-size:10px;margin-left:1px}
  .table-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;overflow:hidden}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{text-align:left;padding:9px 10px;border-bottom:0.5px solid var(--border);vertical-align:top}
  th{background:#fafafa;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;position:sticky;top:0;z-index:1}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  .arrow{font-size:9px;margin-left:2px;opacity:.5}
  tbody tr:hover{background:#fcfcfc}
  tbody tr:last-child td{border-bottom:none}
  .c-idx{width:32px;text-align:center}
  .c-sz{width:48px;text-align:center}
  .c-name{width:220px}
  .c-scale{width:125px}
  .c-org{width:130px}
  .c-date{width:100px}
  .c-src{width:76px}
  .idx-num{font-size:11px;color:var(--muted);font-weight:500}
  .sz-badge{display:inline-block;padding:1px 6px;border:0.5px solid #e0e0e0;background:#fafafa;color:#888;border-radius:3px;font-size:10.5px}
  .name-main{font-weight:600;color:var(--ink);font-size:13px;line-height:1.4}
  .name-sub{color:#bbb;font-size:11px;margin-top:2px;line-height:1.3}
  .scale-per{font-weight:600;color:var(--ink);font-size:12.5px}
  .scale-total{color:#bbb;font-size:11px;margin-top:2px}
  .org-ministry{color:#bbb;font-size:11.5px}
  .org-sep{color:#ccc;margin:0 3px;font-size:10px}
  .org-agency{font-weight:600;color:var(--ink);font-size:11.5px}
  .date-str{color:#bbb;font-size:11px;margin-bottom:3px}
  .dbadge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600}
  .src-btn{display:inline-block;padding:4px 9px;border:0.5px solid var(--border);background:var(--surface);border-radius:5px;font-size:11px;font-weight:500;color:var(--ink);cursor:pointer;text-decoration:none;font-family:inherit;line-height:1.3}
  .src-btn:hover{background:#f5f5f5}
  .empty{text-align:center;padding:48px;color:var(--muted);font-size:13px}
  footer{margin-top:16px;font-size:11px;color:#ddd;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Gov. Insight</div>
    <div class="header-right">
      <div class="tabs">
        <button class="tab active" data-axis="지원사업">지원사업</button>
        <button class="tab" data-axis="공공조달">공공조달</button>
      </div>
      <input class="search-input" id="search" type="text" placeholder="사업명 검색…">
      <div class="count"><b id="count">0</b>건</div>
    </div>
  </header>
  <div class="filter-row">
    <button class="sz-pill" data-sz="large">대형</button>
    <button class="sz-pill" data-sz="mid">중형</button>
    <button class="sz-pill" data-sz="small">소형</button>
    <div class="filter-sep"></div>
    <button class="news-pill" id="newsPreBtn">뉴스·수요조사·동향</button>
  </div>
  <div class="domain-row">
    <span class="domain-label">도메인</span>
    <button class="domain-pill" data-domain="#AI">AI</button>
    <button class="domain-pill" data-domain="#철강·소재">철강·소재</button>
    <button class="domain-pill" data-domain="#로봇">로봇</button>
    <button class="domain-pill" data-domain="#자동차·모빌리티">자동차·모빌리티</button>
    <button class="domain-pill" data-domain="#반도체">반도체</button>
    <button class="domain-pill" data-domain="#석유화학·에너지">석유화학·에너지</button>
    <button class="domain-pill" data-domain="#기타제조산업">기타제조산업</button>
  </div>
  <div class="active-bar" id="activeBar">
    <span class="active-lab">필터</span>
    <span id="activeTags"></span>
    <button class="clear-btn" id="clearAll">초기화</button>
  </div>
  <div class="tag-panel" id="tagPanel"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="c-idx">#</th>
          <th class="c-sz">규모</th>
          <th class="c-name sortable" data-sort="name">사업명<span class="arrow" data-arrow="name"></span></th>
          <th class="c-scale">지원규모</th>
          <th class="c-org">추진체계</th>
          <th class="c-date sortable" data-sort="deadline">공고일정<span class="arrow" data-arrow="deadline"></span></th>
          <th class="c-src">출처</th>
          <th class="c-tags">해시태그</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <footer>
    대형: 총사업비 500억↑ or 과제당 20억↑ &nbsp;&middot;&nbsp;
    중형: 100억~500억 or 5억~20억 &nbsp;&middot;&nbsp;
    소형: 그 이하 &nbsp;&middot;&nbsp;
    소형 off 시 금액 미확인 공고도 숨김 — 소형 버튼으로 전체 표시
  </footer>
</div>

const NEWS_PRE_SRCS = new Set(['뉴스','IRIS사전공고','NTIS','수요조사','뉴스레터']);
const TYPE_LABEL = {ministry:'부처',agency:'전문기관·출처',biztype:'사업유형',role:'추진체계'};
const TYPE_ORDER = ['ministry','agency','biztype','role'];
let DATA=[],currentAxis='지원사업',activeTags=new Set(),activeSz=new Set(),showNewsPre=false,searchQuery='',sortKey='deadline',sortDir=1,RENDERED=[];
async function loadData(){
  try{
    const r=await fetch('data/notices.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(Array.isArray(j)&&j.length){DATA=j;return;}
    throw new Error('empty');
  }catch(e){
    console.warn('notices.json 로드 실패 → 샘플 사용:',e.message);
    DATA=SAMPLE_DATA;
  }
}
function dday(dl){if(!dl)return null;const d=new Date(dl);return isNaN(d)?null:Math.ceil((d-new Date())/86400000);}
function ddayBadge(dl){
  const n=dday(dl);
  if(n===null)return '<span class="dbadge" style="background:#f5f5f5;color:#aaa">미정</span>';
  if(n<0)return '<span class="dbadge" style="background:#f5f5f5;color:#aaa">마감</span>';
  let bg,color;
  if(n<=7){bg='#fff0f0';color='#c0392b';}else if(n<=30){bg='#fff8f0';color='#a0522d';}else{bg='#f0fff4';color='#2e7d52';}
  return '<span class="dbadge" style="background:'+bg+';color:'+color+'">'+(n===0?'D-DAY':'D-'+n)+'</span>';
}
function szBadge(sz){const m={large:'대형',mid:'중형',small:'소형'};return '<span class="sz-badge">'+(m[sz]||'소형')+'</span>';}
function urgency(dl){const n=dday(dl);if(n===null)return 9e8;if(n<0)return 1e6-n;return n;}
function getRows(){
  let rows=DATA.filter(d=>d.axis===currentAxis);
  rows=rows.filter(d=>NEWS_PRE_SRCS.has(d.src)?showNewsPre:(activeSz.size===0||activeSz.has(d.sz||'small')));
  if(activeTags.size){rows=rows.filter(d=>{const s=new Set((d.tags||[]).map(t=>t.text));for(const t of activeTags)if(!s.has(t))return false;return true;});}
  if(searchQuery){const q=searchQuery.toLowerCase();rows=rows.filter(d=>(d.name||'').toLowerCase().includes(q)||(d.sub||'').toLowerCase().includes(q));}
  if(sortKey){rows=rows.slice().sort((a,b)=>{if(sortKey==='deadline')return(urgency(a.deadline)-urgency(b.deadline))*sortDir;return String(a[sortKey]||'').localeCompare(String(b[sortKey]||''),'ko')*sortDir;});}
  return rows;
}
function renderTagPanel(){
  const base=DATA.filter(d=>d.axis===currentAxis);
  const groups={ministry:new Map(),agency:new Map(),biztype:new Map(),role:new Map(),domain:new Map()};
  base.forEach(d=>(d.tags||[]).forEach(t=>{const g=groups[t.type];if(g)g.set(t.text,(g.get(t.text)||0)+1);}));
  let html='';
  TYPE_ORDER.forEach(type=>{
    const g=groups[type];if(!g||!g.size)return;
    const chips=[...g.entries()].sort((a,b)=>b[1]-a[1]).map(([text,cnt])=>
      '<span class="tag'+(activeTags.has(text)?' active':'')+'" data-tag="'+esc(text)+'" data-tag-type="'+type+'">'+esc(text)+'<span class="tag-cnt">'+cnt+'</span></span>'
    ).join('');
    html+='<div class="tag-group"><span class="tag-group-label">'+TYPE_LABEL[type]+'</span><span class="tag-group-chips">'+chips+'</span></div>';
  });
  document.getElementById('tagPanel').innerHTML=html||'<div style="padding:8px 0;font-size:11px;color:#bbb">태그 없음</div>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const rows=getRows();RENDERED=rows;renderTagPanel();
  document.getElementById('count').textContent=rows.length;
  const tbody=document.getElementById('tbody');
  if(!rows.length){
    const total=DATA.filter(d=>d.axis===currentAxis).length;
    const szHidden=activeSz.size>0?DATA.filter(d=>d.axis===currentAxis&&!NEWS_PRE_SRCS.has(d.src)&&!activeSz.has(d.sz||'small')).length:0;
    const hint=szHidden>0?'<br><small style="color:#bbb;font-size:11px">규모 필터로 '+szHidden+'건이 숨겨져 있습니다 — 규모 버튼을 해제하면 전체 표시</small>':'';
    tbody.innerHTML='<tr><td colspan="8" class="empty">조건에 맞는 공고가 없습니다.'+hint+'</td></tr>';
  }else{
    tbody.innerHTML=rows.map((d,i)=>{
      const hp=d.post&&Object.keys(d.post).length;
      const sb=hp?'<button class="src-btn" data-srcidx="'+i+'">'+esc(d.src)+'</button>':'<a class="src-btn" href="'+esc(d.url||'#')+'" target="_blank" rel="noopener">'+esc(d.src)+'</a>';
      const th=(d.tags||[]).map(t=>'<span class="tag'+(activeTags.has(t.text)?' active':'')+'" data-tag="'+esc(t.text)+'" data-tag-type="'+(t.type||'')+'">'+esc(t.text)+'</span>').join('');
      return '<tr>'
        +'<td class="c-idx"><span class="idx-num">'+(i+1)+'</span></td>'
        +'<td class="c-sz">'+szBadge(d.sz)+'</td>'
        +'<td class="c-name"><div class="name-main">'+esc(d.name)+'</div>'+(d.sub?'<div class="name-sub">'+esc(d.sub)+'</div>':'')+'</td>'
        +'<td class="c-scale"><div class="scale-per">'+esc(d.perProject||'확인 필요')+'</div>'+(d.totalBudget&&d.totalBudget!=='-'?'<div class="scale-total">'+esc(d.totalBudget)+'</div>':'')+'</td>'
        +'<td class="c-org"><span class="org-ministry">'+esc(d.ministry||'-')+'</span>'+(d.agency?'<span class="org-sep">›</span><span class="org-agency">'+esc(d.agency)+'</span>':'')+'</td>'
        +'<td class="c-date"><div class="date-str">'+esc(d.deadline||'-')+'</div>'+ddayBadge(d.deadline)+'</td>'
        +'<td class="c-src">'+sb+'</td>'
        +'<td class="c-tags">'+th+'</td>'
        +'</tr>';
    }).join('');
  }
  const bar=document.getElementById('activeBar');const at=document.getElementById('activeTags');
  if(activeTags.size){bar.classList.add('show');at.innerHTML=[...activeTags].map(t=>'<span class="active-chip" data-remove="'+esc(t)+'">'+esc(t)+'<span class="x">\xd7</span></span>').join('');}
  else{bar.classList.remove('show');at.innerHTML='';}
  document.querySelectorAll('[data-arrow]').forEach(el=>{el.textContent=el.dataset.arrow===sortKey?(sortDir>0?' ▲':' ▼'):'';});
  document.querySelectorAll('.domain-pill').forEach(pill=>{pill.classList.toggle('on',activeTags.has(pill.dataset.domain));});
}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentAxis=tab.dataset.axis;activeTags.clear();sortKey='deadline';sortDir=1;render();}));
document.getElementById('search').addEventListener('input',e=>{searchQuery=e.target.value.trim();render();});
document.getElementById('clearAll').addEventListener('click',()=>{activeTags.clear();render();});
document.querySelectorAll('.sz-pill').forEach(pill=>pill.addEventListener('click',()=>{const sz=pill.dataset.sz;activeSz.has(sz)?activeSz.delete(sz):activeSz.add(sz);pill.classList.toggle('on',activeSz.has(sz));render();}));
document.getElementById('newsPreBtn').addEventListener('click',()=>{showNewsPre=!showNewsPre;document.getElementById('newsPreBtn').classList.toggle('on',showNewsPre);render();});
document.querySelectorAll('.domain-pill').forEach(pill=>pill.addEventListener('click',()=>{const t=pill.dataset.domain;activeTags.has(t)?activeTags.delete(t):activeTags.add(t);render();}));
document.addEventListener('click',e=>{
  const src=e.target.closest('[data-srcidx]');if(src){openSrcPost(RENDERED[+src.dataset.srcidx]);return;}
  const tag=e.target.closest('[data-tag]');if(tag){const t=tag.dataset.tag;activeTags.has(t)?activeTags.delete(t):activeTags.add(t);render();return;}
  const rm=e.target.closest('[data-remove]');if(rm){activeTags.delete(rm.dataset.remove);render();return;}
});
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;sortKey===k?(sortDir*=-1):(sortKey=k,sortDir=1);render();}));
let _sw=0;
function openSrcPost(d){
  if(!d||!d.post)return;
  const n='srcwin_'+(++_sw);window.open('',n);
  const f=document.createElement('form');f.method='post';f.action=d.url;f.target=n;f.style.display='none';
  for(const[k,v]of Object.entries(d.post)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i);}
  document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1000);
}
(async()=>{await loadData();render();})();
</script>
