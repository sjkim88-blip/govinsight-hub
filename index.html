<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gov. Insight</title>
<style>
  :root{--ink:#1a1a1a;--muted:#aaa;--border:#e8e8e8;--bg:#f5f5f5;--surface:#fff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
  .wrap{max-width:1600px;margin:0 auto;padding:18px 24px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .logo{font-size:17px;font-weight:500;color:var(--ink);letter-spacing:-.2px}
  .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px}
  .tab{padding:6px 16px;border:0.5px solid var(--border);background:var(--surface);border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:.1s}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .news-pill{padding:5px 11px;border:0.5px solid var(--border);background:var(--surface);border-radius:5px;font-size:11.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:.1s}
  .news-pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .search-input{width:200px;padding:6px 10px;border:0.5px solid var(--border);border-radius:6px;font-size:12px;outline:none;background:var(--surface)}
  .search-input:focus{border-color:#aaa}
  .count{font-size:12px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--ink);font-weight:600}
  .filter-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px}
  .filter-label{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;width:52px;padding-top:5px;text-align:right}
  .chips-wrap{display:flex;flex-wrap:wrap;gap:3px;flex:1}
  .chip{padding:4px 10px;border:0.5px solid var(--border);background:var(--surface);border-radius:5px;font-size:11.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:.1s;white-space:nowrap}
  .chip:hover{border-color:#bbb;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip-cnt{opacity:.45;font-size:10px;margin-left:3px}
  .table-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-top:10px}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{text-align:left;padding:9px 10px;border-bottom:0.5px solid var(--border);vertical-align:top}
  th{background:#fafafa;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;position:sticky;top:0;z-index:1}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  .arrow{font-size:9px;margin-left:2px;opacity:.5}
  tbody tr:hover{background:#fcfcfc}
  tbody tr:last-child td{border-bottom:none}
  .c-idx{width:32px;text-align:center}
  .c-ministry{width:95px}
  .c-agency{width:140px}
  .c-period{width:175px}
  .c-deadline{width:78px;text-align:center}
  .idx-num{font-size:11px;color:var(--muted);font-weight:500}
  td.c-ministry{font-size:12px;color:#555}
  td.c-agency{font-size:12px;font-weight:500;color:#1a1a1a}
  .name-main{font-weight:600;color:var(--ink);font-size:13px;line-height:1.4}
  .name-sub{color:#bbb;font-size:11px;margin-top:2px;line-height:1.3}
  a.name-link,span.name-link{color:inherit;text-decoration:none;cursor:pointer}
  a.name-link:hover,span.name-link:hover{text-decoration:underline;color:#2d5a8e}
  td.c-period{color:#888;font-size:11.5px}
  .dbadge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600}
  .empty{text-align:center;padding:48px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Gov. Insight</div>
    <div class="header-right">
      <div class="tabs">
        <button class="tab active" data-axis="지원사업">지원사업</button>
        <button class="tab" data-axis="공공조달">공공조달</button>
      </div>
      <button class="news-pill" id="newsPreBtn">뉴스·수요조사·동향</button>
      <input class="search-input" id="search" type="text" placeholder="사업명 검색…">
      <div class="count"><b id="count">0</b>건</div>
    </div>
  </header>
  <div class="filter-row">
    <span class="filter-label">정부부처</span>
    <span id="ministryChips" class="chips-wrap"></span>
  </div>
  <div class="filter-row">
    <span class="filter-label">전문기관</span>
    <span id="agencyChips" class="chips-wrap"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="c-idx">#</th>
          <th class="c-ministry">정부부처</th>
          <th class="c-agency">전문기관</th>
          <th class="c-name sortable" data-sort="name">공고명<span class="arrow" data-arrow="name"></span></th>
          <th class="c-period">서류접수기간</th>
          <th class="c-deadline sortable" data-sort="deadline">마감일<span class="arrow" data-arrow="deadline"></span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

/*SAMPLE_DATA_END*/
const NEWS_PRE_SRCS = new Set(['뉴스','IRIS사전공고','NTIS','수요조사','뉴스레터']);

const MINISTRY_WHITELIST = {
  '지원사업': ['산업통상자원부','과학기술정보통신부','중소벤처기업부','조달청'],
  '공공조달': ['조달청'],
};

const AGENCY_GROUPS = [
  {label:'한국산업기술기획평가원(KEIT)', keys:new Set(['한국산업기술기획평가원','KEIT'])},
  {label:'한국산업기술진흥원(KIAT)',     keys:new Set(['한국산업기술진흥원','KIAT'])},
  {label:'정보통신기획평가원(IITP)',     keys:new Set(['정보통신기획평가원','IITP'])},
  {label:'정보통신산업진흥원(NIPA)',     keys:new Set(['정보통신산업진흥원','NIPA'])},
  {label:'중소기업기술정보진흥원(TIPA)', keys:new Set(['중소기업기술정보진흥원','TIPA'])},
];

let DATA=[],currentAxis='지원사업',activeMinistry=new Set(),activeAgency=new Set(),showNewsPre=false,searchQuery='',sortKey='deadline',sortDir=1,RENDERED=[];

async function loadData(){
  try{
    const r=await fetch('data/notices.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(Array.isArray(j)&&j.length){DATA=j;return;}
    throw new Error('empty');
  }catch(e){
    console.warn('notices.json 로드 실패 → 샘플 사용:',e.message);
    DATA=SAMPLE_DATA;
  }
}
function dday(dl){if(!dl)return null;const d=new Date(dl);return isNaN(d)?null:Math.ceil((d-new Date())/86400000);}
function ddayBadge(dl){
  const n=dday(dl);
  if(n===null)return '<span class="dbadge" style="background:#f5f5f5;color:#aaa">미정</span>';
  if(n<0)return '<span class="dbadge" style="background:#f5f5f5;color:#aaa">마감</span>';
  let bg,color;
  if(n<=7){bg='#fff0f0';color='#c0392b';}else if(n<=30){bg='#fff8f0';color='#a0522d';}else{bg='#f0fff4';color='#2e7d52';}
  return '<span class="dbadge" style="background:'+bg+';color:'+color+'">'+(n===0?'D-DAY':'D-'+n)+'</span>';
}
function urgency(dl){const n=dday(dl);if(n===null)return 9e8;if(n<0)return 1e6-n;return n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function getRows(){
  let rows=DATA.filter(d=>d.axis===currentAxis);
  rows=rows.filter(d=>NEWS_PRE_SRCS.has(d.src)?showNewsPre:true);
  if(activeMinistry.size)rows=rows.filter(d=>activeMinistry.has(d.ministry||''));
  if(activeAgency.size)rows=rows.filter(d=>{
    const a=d.agency||'';
    return[...activeAgency].some(lbl=>{
      const g=AGENCY_GROUPS.find(x=>x.label===lbl);
      return g?g.keys.has(a):false;
    });
  });
  if(searchQuery){const q=searchQuery.toLowerCase();rows=rows.filter(d=>(d.name||'').toLowerCase().includes(q)||(d.sub||'').toLowerCase().includes(q));}
  if(sortKey){rows=rows.slice().sort((a,b)=>{if(sortKey==='deadline')return(urgency(a.deadline)-urgency(b.deadline))*sortDir;return String(a[sortKey]||'').localeCompare(String(b[sortKey]||''),'ko')*sortDir;});}
  return rows;
}

function buildMinistryChips(){
  const allowed=(MINISTRY_WHITELIST[currentAxis]||[]);
  const base=DATA.filter(d=>d.axis===currentAxis);
  return allowed.map(m=>{
    const cnt=base.filter(d=>d.ministry===m).length;
    if(!cnt)return '';
    return '<button class="chip'+(activeMinistry.has(m)?' on':'')+'" data-ministry="'+esc(m)+'">'+esc(m)+'<span class="chip-cnt">'+cnt+'</span></button>';
  }).join('');
}

function buildAgencyChips(){
  const base=DATA.filter(d=>d.axis===currentAxis);
  return AGENCY_GROUPS.map(grp=>{
    const cnt=base.filter(d=>grp.keys.has(d.agency||'')).length;
    if(!cnt)return '';
    return '<button class="chip'+(activeAgency.has(grp.label)?' on':'')+'" data-agency="'+esc(grp.label)+'">'+esc(grp.label)+'<span class="chip-cnt">'+cnt+'</span></button>';
  }).join('');
}

function render(){
  const rows=getRows();RENDERED=rows;
  document.getElementById('count').textContent=rows.length;
  document.getElementById('ministryChips').innerHTML=buildMinistryChips();
  document.getElementById('agencyChips').innerHTML=buildAgencyChips();
  const tbody=document.getElementById('tbody');
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="6" class="empty">조건에 맞는 공고가 없습니다.</td></tr>';
  }else{
    tbody.innerHTML=rows.map((d,i)=>{
      const hp=d.post&&Object.keys(d.post).length;
      const nameEl=hp
        ?'<span class="name-link" data-srcidx="'+i+'">'+esc(d.name)+'</span>'
        :'<a class="name-link" href="'+esc(d.url||'#')+'" target="_blank" rel="noopener">'+esc(d.name)+'</a>';
      const subEl=d.sub?'<div class="name-sub">'+esc(d.sub)+'</div>':'';
      const periodEl=esc(d.period||(d.deadline?'~ '+d.deadline:'-'));
      return '<tr>'
        +'<td class="c-idx"><span class="idx-num">'+(i+1)+'</span></td>'
        +'<td class="c-ministry">'+esc(d.ministry||'-')+'</td>'
        +'<td class="c-agency">'+esc(d.agency||'-')+'</td>'
        +'<td class="c-name"><div class="name-main">'+nameEl+'</div>'+subEl+'</td>'
        +'<td class="c-period">'+periodEl+'</td>'
        +'<td class="c-deadline">'+ddayBadge(d.deadline)+'</td>'
        +'</tr>';
    }).join('');
  }
  document.querySelectorAll('[data-arrow]').forEach(el=>{el.textContent=el.dataset.arrow===sortKey?(sortDir>0?' ▲':' ▼'):'';});
}

document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');currentAxis=tab.dataset.axis;
  activeMinistry.clear();activeAgency.clear();
  sortKey='deadline';sortDir=1;render();
}));
document.getElementById('search').addEventListener('input',e=>{searchQuery=e.target.value.trim();render();});
document.getElementById('newsPreBtn').addEventListener('click',()=>{showNewsPre=!showNewsPre;document.getElementById('newsPreBtn').classList.toggle('on',showNewsPre);render();});
document.addEventListener('click',e=>{
  const src=e.target.closest('[data-srcidx]');if(src){openSrcPost(RENDERED[+src.dataset.srcidx]);return;}
  const mc=e.target.closest('[data-ministry]');if(mc){const m=mc.dataset.ministry;activeMinistry.has(m)?activeMinistry.delete(m):activeMinistry.add(m);render();return;}
  const ac=e.target.closest('[data-agency]');if(ac){const a=ac.dataset.agency;activeAgency.has(a)?activeAgency.delete(a):activeAgency.add(a);render();return;}
});
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;sortKey===k?(sortDir*=-1):(sortKey=k,sortDir=1);render();}));

let _sw=0;
function openSrcPost(d){
  if(!d||!d.post)return;
  const n='srcwin_'+(++_sw);window.open('',n);
  const f=document.createElement('form');f.method='post';f.action=d.url;f.target=n;f.style.display='none';
  for(const[k,v]of Object.entries(d.post)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i);}
  document.body.appendChild(f);f.submit();f.remove();
}
loadData().then(render);
</script>
