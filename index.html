<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Hub</title>
<style>
  :root{--ink:#111;--muted:#aaa;--border:#e8e8e8;--bg:#fafafa;--surface:#fff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5}
  .wrap{max-width:1600px;margin:0 auto;padding:18px 24px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .logo{font-size:17px;font-weight:500;color:var(--ink);letter-spacing:-.2px}
  .header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* 메인 탭 */
  .tabs{display:flex;gap:4px}
  .tab{padding:9px 18px;border:none;border-radius:7px;background:#f5f5f5;color:#777;font-size:12.5px;font-weight:600;cursor:pointer;transition:.1s}
  .tab.active{background:#111;color:#fff}

  .search-input{width:200px;padding:6px 10px;border:0.5px solid var(--border);border-radius:6px;font-size:12px;outline:none;background:var(--surface)}
  .search-input:focus{border-color:#aaa}
  .count{font-size:12px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--ink);font-weight:600}

  /* 정부부처 칩 */
  .filter-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px}
  .filter-label{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;width:52px;padding-top:6px;text-align:right}
  .chips-wrap{display:flex;flex-wrap:wrap;gap:5px;flex:1}
  .chip{padding:5px 10px;border-radius:6px;border:0.5px solid #e2e2e2;background:var(--surface);color:#555;font-size:11.5px;font-weight:500;cursor:pointer;transition:.1s;white-space:nowrap}
  .chip:hover{border-color:#bbb;color:var(--ink)}
  .chip.on{background:#eef2ff;border-color:#3b4cca;color:#3b4cca;font-weight:600}
  .chip-cnt{color:#aaa;font-size:10.5px;margin-left:4px}
  .chip.on .chip-cnt{color:#7c8ce0}

  /* 한경 스타일 가로 서브탭(전문기관 / 도메인) */
  .h-tabs{display:flex;gap:22px;border-bottom:1.5px solid #eee;margin-bottom:14px;overflow-x:auto}
  .h-tab{padding:11px 2px;border:none;background:none;color:#999;font-size:12.5px;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:.1s}
  .h-tab:hover{color:#555}
  .h-tab.active{color:#111;font-weight:700;border-bottom-color:#111}
  .h-tab.accent{color:#7b3fd4}
  .h-tab.accent.active{color:#7b3fd4;border-bottom-color:#7b3fd4}

  /* IT회사 동향 pill 서브탭 */
  .pill-tabs{display:flex;gap:6px;margin-bottom:14px}
  .pill-tab{padding:5px 12px;border-radius:16px;border:1px solid #ddd;background:var(--surface);color:#777;font-size:12px;font-weight:600;cursor:pointer;transition:.1s}
  .pill-tab.active{background:#111;border-color:#111;color:#fff}

  /* 정부지원사업 표 */
  .table-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-top:4px}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{text-align:left;padding:11px 6px;border-bottom:0.5px solid #f2f2f2;vertical-align:top}
  th{background:#fafafa;font-size:11px;font-weight:600;color:#999;white-space:nowrap;position:sticky;top:0;z-index:1}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  .arrow{font-size:9px;margin-left:2px;opacity:.5}
  tbody tr:hover{background:#fcfcfc}
  tbody tr:last-child td{border-bottom:none}
  .c-agency{width:190px}
  .c-period{width:175px}
  .c-deadline{width:78px;text-align:center}
  td.c-agency{font-size:12px;font-weight:500;color:#1a1a1a}
  .name-main{font-weight:600;color:var(--ink);font-size:12.8px;line-height:1.4}
  .name-sub{color:#999;font-size:11px;margin-top:2px;line-height:1.3}
  a.name-link,span.name-link{color:inherit;text-decoration:none;cursor:pointer}
  a.name-link:hover,span.name-link:hover{text-decoration:underline;color:#2d5a8e}
  td.c-period{color:#888;font-size:11.5px}
  .dbadge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600}
  .demand-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10.5px;font-weight:700;background:#f3eefe;color:#7b3fd4;margin-right:5px;vertical-align:1px}
  .empty{text-align:center;padding:48px;color:var(--muted);font-size:13px}

  /* 뉴스/동향/IT회사 동향 리스트 */
  .news-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-top:4px}
  .news-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:0.5px solid #f2f2f2}
  .news-row:last-child{border-bottom:none}
  .news-row:hover{background:#fcfcfc}
  .tagbox{flex-shrink:0;min-width:44px;max-width:52px;text-align:center;padding:3px 4px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .tagbox-news{background:#eef2ff;color:#3b4cca}
  .tagbox-trend{background:#f3eefe;color:#7b3fd4}
  .tagbox-company{background:#fff4e5;color:#c07800}
  .news-body{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .news-title{font-weight:600;font-size:12.8px;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .news-title:hover{text-decoration:underline;color:#2d5a8e}
  .news-date{flex-shrink:0;font-size:11px;color:#aaa}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Opportunity Hub</div>
    <div class="header-right">
      <div class="tabs">
        <button class="tab active" data-axis="지원사업">정부지원사업</button>
        <button class="tab" data-axis="IT회사 동향">IT회사 동향</button>
        <button class="tab" data-axis="산업별 뉴스">산업별 뉴스</button>
      </div>
      <input class="search-input" id="search" type="text" placeholder="검색…">
      <div class="count"><b id="count">0</b>건</div>
    </div>
  </header>

  <!-- 정부지원사업 -->
  <section id="panel-지원사업">
    <div class="filter-row">
      <span class="filter-label">정부부처</span>
      <span id="ministryChips" class="chips-wrap"></span>
    </div>
    <div class="h-tabs" id="agencyTabs"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="c-agency">전문기관</th>
            <th class="c-name sortable" data-sort="name">공고명<span class="arrow" data-arrow="name"></span></th>
            <th class="c-period">서류접수기간</th>
            <th class="c-deadline sortable" data-sort="deadline">마감일<span class="arrow" data-arrow="deadline"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- IT회사 동향 -->
  <section id="panel-IT회사 동향" hidden>
    <div class="pill-tabs" id="regionTabs"></div>
    <div class="news-wrap"><div id="itcoList"></div></div>
  </section>

  <!-- 산업별 뉴스 -->
  <section id="panel-산업별 뉴스" hidden>
    <div class="h-tabs" id="domainTabs"></div>
    <div class="news-wrap"><div id="newsList"></div></div>
  </section>
</div>

const MINISTRY_LIST = ['산업통상자원부','과학기술정보통신부','중소벤처기업부'];

// 전문기관 서브탭: 순서 고정(공고 건수 아닌 R&D 커버리지/기관 위상 기준)
const AGENCY_TABS = ['전체','수요조사','KEIT','NIPA','KISTEP','TIPA','KIAT','KETEP','IITP','NRF'];
const AGENCY_LABELS = {
  '전체':'전체',
  '수요조사':'수요조사',
  'KEIT':'한국산업기술기획평가원(KEIT)',
  'NIPA':'정보통신산업진흥원(NIPA)',
  'KISTEP':'한국과학기술기획평가원(KISTEP)',
  'TIPA':'중소기업기술정보진흥원(TIPA)',
  'KIAT':'한국산업기술진흥원(KIAT)',
  'KETEP':'한국에너지기술평가원(KETEP)',
  'IITP':'정보통신기획평가원(IITP)',
  'NRF':'한국연구재단(NRF)',
};

const REGION_TABS = [{key:'domestic',label:'국내'},{key:'global',label:'해외'}];
// 도메인 6개 + 동향(KEIT, src==='뉴스레터' 전용) — 도메인 탭과 같은 레벨의 마지막 탭
const DOMAIN_TABS = ['철강','AI','반도체·전자','모빌리티·자동차','소재·에너지','석유화학','KEIT'];

let DATA=[],currentAxis='지원사업',
    activeMinistry=new Set(),activeAgencyTab='전체',
    activeRegion='domestic',activeCategory=DOMAIN_TABS[0],
    searchQuery='',sortKey='deadline',sortDir=1,RENDERED=[];

async function loadData(){
  try{
    const r=await fetch('data/notices.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(Array.isArray(j)&&j.length){DATA=j;return;}
    throw new Error('empty');
  }catch(e){
    console.warn('notices.json 로드 실패 → 샘플 사용:',e.message);
    DATA=SAMPLE_DATA;
  }
}

function dday(dl){if(!dl)return null;const d=new Date(dl);return isNaN(d)?null:Math.ceil((d-new Date())/86400000);}
function ddayBadge(dl){
  const n=dday(dl);
  if(n===null)return '<span class="dbadge" style="background:#f5f5f5;color:#aaa">미정</span>';
  if(n<0)return '<span class="dbadge" style="background:#f5f5f5;color:#aaa">마감</span>';
  let bg,color;
  if(n<=7){bg='#fff0f0';color='#c0392b';}else if(n<=30){bg='#fff8f0';color='#a0522d';}else{bg='#f0fff4';color='#2e7d52';}
  return '<span class="dbadge" style="background:'+bg+';color:'+color+'">'+(n===0?'D-DAY':'D-'+n)+'</span>';
}
function urgency(dl){const n=dday(dl);if(n===null)return 9e8;if(n<0)return 1e6-n;return n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function getRows(){
  let rows=DATA.filter(d=>d.axis===currentAxis);
  if(currentAxis==='지원사업'){
    if(activeMinistry.size)rows=rows.filter(d=>activeMinistry.has(d.ministry||''));
    if(activeAgencyTab!=='전체'){
      rows=rows.filter(d=>d.src===activeAgencyTab);
    }
  }else if(currentAxis==='IT회사 동향'){
    rows=rows.filter(d=>d.region===activeRegion);
  }else if(currentAxis==='산업별 뉴스'){
    if(activeCategory==='KEIT')rows=rows.filter(d=>d.src==='뉴스레터');
    else rows=rows.filter(d=>d.category===activeCategory&&d.src!=='뉴스레터');
  }
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    rows=rows.filter(d=>(d.name||'').toLowerCase().includes(q)||(d.sub||'').toLowerCase().includes(q));
  }
  if(currentAxis==='지원사업'){
    if(sortKey)rows=rows.slice().sort((a,b)=>{if(sortKey==='deadline')return(urgency(a.deadline)-urgency(b.deadline))*sortDir;return String(a[sortKey]||'').localeCompare(String(b[sortKey]||''),'ko')*sortDir;});
  }else{
    rows=rows.slice().sort((a,b)=>String(b.pubDate||'').localeCompare(String(a.pubDate||'')));
  }
  return rows;
}

function buildMinistryChips(){
  const base=DATA.filter(d=>d.axis==='지원사업');
  return MINISTRY_LIST.map(m=>{
    const cnt=base.filter(d=>d.ministry===m).length;
    if(!cnt)return '';
    return '<button class="chip'+(activeMinistry.has(m)?' on':'')+'" data-ministry="'+esc(m)+'">'+esc(m)+'<span class="chip-cnt">'+cnt+'</span></button>';
  }).join('');
}

function buildAgencyTabs(){
  return AGENCY_TABS.map(key=>{
    const cls=['h-tab'];
    if(key==='수요조사')cls.push('accent');
    if(activeAgencyTab===key)cls.push('active');
    return '<button class="'+cls.join(' ')+'" data-agencytab="'+esc(key)+'">'+esc(AGENCY_LABELS[key])+'</button>';
  }).join('');
}

function buildRegionTabs(){
  return REGION_TABS.map(r=>'<button class="pill-tab'+(activeRegion===r.key?' active':'')+'" data-region="'+r.key+'">'+r.label+'</button>').join('');
}

function buildDomainTabs(){
  return DOMAIN_TABS.map(d=>{
    const cls=['h-tab'];
    if(d==='KEIT')cls.push('accent');
    if(activeCategory===d)cls.push('active');
    return '<button class="'+cls.join(' ')+'" data-domain="'+esc(d)+'">'+esc(d)+'</button>';
  }).join('');
}

function agencyCell(d){
  const agency=d.agency||'';
  if(!agency)return esc(d.src||'-');
  if(!d.src||d.src==='수요조사'||d.src===agency)return esc(agency);
  return esc(agency)+' <span style="color:#aaa">('+esc(d.src)+')</span>';
}

function renderGrantRows(rows){
  const tbody=document.getElementById('tbody');
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="4" class="empty">조건에 맞는 공고가 없습니다.</td></tr>';
    return;
  }
  tbody.innerHTML=rows.map((d,i)=>{
    const hp=d.post&&Object.keys(d.post).length;
    const demandBadge=d.src==='수요조사'?'<span class="demand-badge">수요조사</span>':'';
    const nameEl=hp
      ?'<span class="name-link" data-srcidx="'+i+'">'+esc(d.name)+'</span>'
      :'<a class="name-link" href="'+esc(d.url||'#')+'" target="_blank" rel="noopener">'+esc(d.name)+'</a>';
    const subEl=d.sub?'<div class="name-sub">'+esc(d.sub)+'</div>':'';
    const periodEl=esc(d.period||(d.deadline?'~ '+d.deadline:'-'));
    return '<tr>'
      +'<td class="c-agency">'+agencyCell(d)+'</td>'
      +'<td class="c-name"><div class="name-main">'+demandBadge+' '+nameEl+'</div>'+subEl+'</td>'
      +'<td class="c-period">'+periodEl+'</td>'
      +'<td class="c-deadline">'+ddayBadge(d.deadline)+'</td>'
      +'</tr>';
  }).join('');
}

function newsRowHtml(d,i){
  let tag;
  if(currentAxis==='IT회사 동향'){
    tag='<span class="tagbox tagbox-company">'+esc(d.company||'')+'</span>';
  }else{
    const isTrend=d.src==='뉴스레터';
    tag='<span class="tagbox '+(isTrend?'tagbox-trend':'tagbox-news')+'">'+(isTrend?'동향':'뉴스')+'</span>';
  }
  const hp=d.post&&Object.keys(d.post).length;
  const link=hp
    ?'<span class="news-title name-link" data-srcidx="'+i+'">'+esc(d.name)+'</span>'
    :'<a class="news-title" href="'+esc(d.url||'#')+'" target="_blank" rel="noopener">'+esc(d.name)+'</a>';
  const dateEl='<span class="news-date">'+esc(d.pubDate||'')+'</span>';
  return '<div class="news-row">'+tag+'<div class="news-body">'+link+dateEl+'</div></div>';
}

function renderNewsRows(containerId, rows){
  const el=document.getElementById(containerId);
  if(!rows.length){
    el.innerHTML='<div class="empty">조건에 맞는 기사가 없습니다.</div>';
    return;
  }
  el.innerHTML=rows.map((d,i)=>newsRowHtml(d,i)).join('');
}

function render(){
  const rows=getRows();RENDERED=rows;
  document.getElementById('count').textContent=rows.length;

  ['지원사업','IT회사 동향','산업별 뉴스'].forEach(ax=>{
    document.getElementById('panel-'+ax).hidden=(ax!==currentAxis);
  });

  if(currentAxis==='지원사업'){
    document.getElementById('ministryChips').innerHTML=buildMinistryChips();
    document.getElementById('agencyTabs').innerHTML=buildAgencyTabs();
    renderGrantRows(rows);
    document.querySelectorAll('[data-arrow]').forEach(el=>{el.textContent=el.dataset.arrow===sortKey?(sortDir>0?' ▲':' ▼'):'';});
  }else if(currentAxis==='IT회사 동향'){
    document.getElementById('regionTabs').innerHTML=buildRegionTabs();
    renderNewsRows('itcoList', rows);
  }else{
    document.getElementById('domainTabs').innerHTML=buildDomainTabs();
    renderNewsRows('newsList', rows);
  }
}

document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');currentAxis=tab.dataset.axis;
  activeMinistry.clear();activeAgencyTab='전체';
  sortKey='deadline';sortDir=1;
  render();
}));
document.getElementById('search').addEventListener('input',e=>{searchQuery=e.target.value.trim();render();});
document.addEventListener('click',e=>{
  const src=e.target.closest('[data-srcidx]');if(src){openSrcPost(RENDERED[+src.dataset.srcidx]);return;}
  const mc=e.target.closest('[data-ministry]');if(mc){const m=mc.dataset.ministry;activeMinistry.has(m)?activeMinistry.delete(m):activeMinistry.add(m);render();return;}
  const at=e.target.closest('[data-agencytab]');if(at){activeAgencyTab=at.dataset.agencytab;render();return;}
  const rt=e.target.closest('[data-region]');if(rt){activeRegion=rt.dataset.region;render();return;}
  const dt=e.target.closest('[data-domain]');if(dt){activeCategory=dt.dataset.domain;render();return;}
});
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.sort;sortKey===k?(sortDir*=-1):(sortKey=k,sortDir=1);render();}));

let _sw=0;
function openSrcPost(d){
  if(!d||!d.post)return;
  const n='srcwin_'+(++_sw);window.open('',n);
  const f=document.createElement('form');f.method='post';f.action=d.url;f.target=n;f.style.display='none';
  for(const[k,v]of Object.entries(d.post)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i);}
  document.body.appendChild(f);f.submit();f.remove();
}
loadData().then(render);
</script>
</body>
